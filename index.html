<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de gestión de estudiantes</title>
    <link rel="stylesheet" href="src/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Sistema de gestión de estudiantes</h1>
    <p>Bienvenido al sistema de gestión de estudiantes.</p>
    <p>aqui encontraras tus datos y calificaciones.</p>
    <article>
        <div class="formulario">
            <form id="formulario">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" required>
                <label for="genero">Género:</label>
                <select id="genero" name="genero" required>
                    <option value="">Seleccionar</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
                <button type="submit">Obtener promedio</button>
            </form>
        </div>
        <div id="resultado">
            <h2>Resultado:</h2>
            <p id="promedio"></p>
        </div>
    </article>
    
    <script src="src/02data_type.js"></script>

</body>
</html>
